<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>윤강닷컴</title>

<style>
:root{
  --bg:#0b0d11;
  --card:#151922;
  --card2:#1b202a;
  --line:#2a313d;
  --text:#f4f7fb;
  --muted:#929baa;
  --accent:#d9ff5a;
  --green:#4dd17a;
  --orange:#ffb24a;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  background:var(--bg);
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Pretendard",
    "Noto Sans KR",
    sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100svh;
  padding:22px 18px 40px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:28px;
}

.brand{
  font-weight:900;
  letter-spacing:.18em;
  font-size:13px;
}

.home{
  border:0;
  border-radius:14px;
  padding:11px 14px;
  background:var(--card2);
  color:var(--text);
  font-weight:800;
}

.kicker{
  font-size:12px;
  color:var(--accent);
  font-weight:900;
  letter-spacing:.1em;
  margin-bottom:10px;
}

h1{
  font-size:32px;
  line-height:1.18;
  margin:0 0 10px;
  letter-spacing:-.04em;
}

.desc{
  color:var(--muted);
  line-height:1.7;
  margin:0 0 24px;
}

.grid{
  display:grid;
  gap:11px;
}

.choice{
  width:100%;
  border:1px solid var(--line);
  border-radius:20px;
  background:var(--card);
  color:var(--text);
  padding:18px;
  text-align:left;
}

.choice:active{
  transform:scale(.99);
}

.choice strong{
  display:block;
  font-size:17px;
}

.choice small{
  display:block;
  margin-top:5px;
  color:var(--muted);
}

.back{
  width:100%;
  margin-top:18px;
  padding:14px;
  border:0;
  background:transparent;
  color:var(--muted);
}

.row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid var(--line);
}

.row .code{
  flex:1;
  word-break:break-all;
}

.action{
  border:0;
  border-radius:12px;
  padding:10px 12px;
  background:var(--accent);
  color:#111;
  font-weight:900;
}

.editor{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:16px;
}

textarea,
input,
select{
  width:100%;
  background:#0e1117;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px;
  font-size:16px;
}

textarea{
  min-height:160px;
  resize:vertical;
}

.save{
  width:100%;
  margin-top:12px;
  border:0;
  border-radius:15px;
  padding:14px;
  background:var(--accent);
  color:#111;
  font-weight:900;
}

.note{
  font-size:12px;
  color:var(--muted);
  line-height:1.6;
  margin-top:12px;
}

.placeholder{
  background:var(--card);
  border:1px dashed var(--line);
  border-radius:20px;
  padding:22px;
  color:var(--muted);
  line-height:1.7;
}

.label{
  font-size:12px;
  color:var(--muted);
  font-weight:800;
  margin:12px 0 7px;
}

.manageItem{
  display:flex;
  gap:8px;
  align-items:center;
  margin-top:9px;
}

.manageItem input{
  flex:1;
}

.del{
  border:0;
  border-radius:12px;
  background:#2a1a1d;
  color:#ff8b8b;
  padding:11px;
}

.infoCard{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:20px;
}

.infoCard h2{
  margin:0 0 10px;
  font-size:25px;
}

.infoCard p{
  white-space:pre-wrap;
  color:var(--muted);
  line-height:1.75;
  margin:0;
}

.textEditBtn{
  border:0;
  border-radius:14px;
  padding:11px 14px;
  background:var(--accent);
  color:#111;
  font-weight:900;
}

.editOverlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:var(--bg);
  overflow:auto;
}

.editOverlay.open{
  display:block;
}

.editWrap{
  max-width:520px;
  margin:auto;
  padding:22px 18px 44px;
}

.editHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  position:sticky;
  top:0;
  background:rgba(11,13,17,.96);
  backdrop-filter:blur(12px);
  padding:10px 0 14px;
  z-index:3;
}

.editHead h2{
  margin:0;
  font-size:21px;
}

.editSection{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:16px;
  margin:12px 0;
}

.editSection h3{
  margin:0 0 13px;
  font-size:14px;
}

.editLabel{
  display:block;
  color:var(--muted);
  font-size:11px;
  font-weight:800;
  margin:11px 0 6px;
}

.editInput{
  width:100%;
  background:#0e1117;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:13px;
  padding:12px;
  font-size:16px;
}

.editActions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:16px;
}

.editMenu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:16px;
}

.editMenuBtn{
  min-height:92px;
  border:1px solid var(--line);
  border-radius:20px;
  background:var(--card);
  color:var(--text);
  font-size:24px;
  font-weight:900;
  text-align:left;
  padding:18px;
}

.editMenuBtn small{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  margin-top:6px;
}

.editBack{
  border:0;
  background:transparent;
  color:var(--muted);
  font-weight:800;
  padding:10px 2px;
}

.urlHint{
  font-size:11px;
  color:var(--muted);
  line-height:1.5;
  margin-top:5px;
}

.backupBox{
  margin-top:16px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:18px;
  background:var(--card);
}

.backupBox h3{
  margin:0 0 8px;
  font-size:14px;
}

.backupActions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.fileInput{
  display:none;
}

/* ================================
   KBO
================================ */

.kboBox{
  margin-top:14px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--card);
}

.kboTitle{
  font-weight:800;
  margin-bottom:10px;
}

.kboMuted{
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
}

.kboGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
  margin-top:10px;
}

.kboPlayer{
  padding:11px;
  border:1px solid var(--line);
  border-radius:13px;
  background:transparent;
  color:var(--text);
  text-align:left;
}

.kboPlayer:active{
  background:var(--card2);
}

.kboPlayer small{
  display:block;
  color:var(--muted);
  margin-top:3px;
}

.kboTable{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
  margin-top:8px;
  min-width:520px;
}

.kboTable td,
.kboTable th{
  padding:8px 5px;
  border-bottom:1px solid var(--line);
  text-align:center;
  white-space:nowrap;
}

.kboTable th{
  color:var(--muted);
}

.kboLiveHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.kboRefresh{
  border:1px solid var(--line);
  border-radius:11px;
  background:transparent;
  color:var(--text);
  padding:8px 10px;
  font-weight:700;
}

.kboScore{
  font-size:30px;
  font-weight:900;
  margin:10px 0;
}

.kboGame{
  padding:13px;
  border:1px solid var(--line);
  border-radius:14px;
  margin-top:10px;
}

.kboTableWrap{
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}

.kboError{
  padding:12px;
  border:1px solid #5b2930;
  background:#25171a;
  border-radius:13px;
  margin-top:10px;
  color:#ffb6bd;
  line-height:1.65;
}

.kboSection{
  margin-top:22px;
}

.kboLoading{
  padding:16px;
  text-align:center;
  color:var(--muted);
}

.playerHero{
  background:
    linear-gradient(
      135deg,
      #171c26,
      #11141a
    );
}

.playerName{
  font-size:29px;
  font-weight:950;
  letter-spacing:-.05em;
}

.playerSub{
  margin-top:7px;
  color:var(--muted);
  font-size:13px;
}

.playerStats{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:9px;
  margin-top:13px;
}

.statCard{
  background:var(--card2);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px 10px;
  text-align:center;
}

.statLabel{
  color:var(--muted);
  font-size:11px;
  font-weight:800;
  margin-bottom:7px;
}

.statValue{
  font-size:20px;
  font-weight:900;
  letter-spacing:-.03em;
}

.playerInfoRow{
  padding:10px 0;
  border-bottom:1px solid var(--line);
}

.playerInfoRow:last-child{
  border-bottom:0;
}

.playerInfoLabel{
  color:var(--muted);
  font-size:11px;
  margin-bottom:4px;
}

.playerInfoValue{
  font-weight:800;
  line-height:1.5;
}
</style>

</head>

<body>

<div class="app">

<header>

<div
  class="brand"
  id="brandText"
>
윤강닷컴
</div>

<div style="display:flex;gap:8px">

<button
  class="home"
  id="home"
>
처음
</button>

<button
  class="textEditBtn"
  id="textEditBtn"
>
텍스트 편집
</button>

</div>

</header>

<div id="screen"></div>

</div>


<div
  class="editOverlay"
  id="textEditor"
>

<div class="editWrap">

<div class="editHead">

<h2 id="editTitle">
텍스트 편집
</h2>

<button
  class="home"
  id="closeTextEditor"
>
닫기
</button>

</div>

<div id="textEditorFields"></div>

</div>

</div>


<script>

/* =====================================================
   저장 키
===================================================== */

const K1="path-option1-data";
const K2="path-option2-data";
const KC="path-option-c-planner";

const KT="path-site-text-v1";
const KL="path-site-links-v1";


/* =====================================================
   기본 텍스트
===================================================== */

const DEFAULT_TEXT={

  brand:"윤강닷컴",

  rootKicker:"STEP 1",

  rootTitle:"원하는 항목을 선택하세요",

  rootDesc:"첫 화면에는 4개의 선택지가 있습니다.",

  root1:"흐흐흐",

  root1Sub:"",

  root2:"시험범위",

  root2Sub:"",

  root3:"이번주할일",

  root3Sub:"",

  root4:"롯데 자이언츠",

  root4Sub:"KBO 실시간 정보",

  oneTitle:"뭐할낀데",

  oneDesc:"",

  oneA:"만화",

  oneASub:"",

  oneB:"영상",

  oneBSub:"",

  oneATitle:"히토시마",

  oneADesc:"",

  dataView:"보러가기",

  dataViewSub:"",

  dataEdit:"품번입력",

  dataEditSub:"",

  oneBTitle:"어디서볼래",

  oneBDesc:"",

  twoTitle:"이번 시험범위",

  twoDesc:"",

  twoA:"시험범위 보기",

  twoASub:"",

  twoB:"시험범위 입력하기",

  twoBSub:"",

  twoC:"필기하기",

  twoCSub:"",

  cTitle:"일별 할일 보기",

  cDesc:"",

  cView:"이번주 계획",

  cViewSub:"",

  cEdit:"계획 작성",

  cEditSub:"",

  dTitle:"롯데 자이언츠",

  dDesc:"KBO 공식 데이터를 윤강닷컴 안에서 확인합니다.",

  "group-name-0":"국어",

  "group-name-1":"영어",

  "group-name-2":"수학",

  "group-name-3":"역사",

  "group-name-4":"과학",

  "group-name-5":"도덕",

  "group-name-6":"기가",

  "group-name-7":"정보"

};


let txt;

try{

  txt=
  JSON.parse(
    localStorage.getItem(KT)
  )
  ||
  JSON.parse(
    JSON.stringify(
      DEFAULT_TEXT
    )
  );

}catch(e){

  txt=
  JSON.parse(
    JSON.stringify(
      DEFAULT_TEXT
    )
  );

}


/* =====================================================
   링크
===================================================== */

const DEFAULT_LINKS={

  oneABase:
  "https://hitomi.la/reader/",

  oneB:[

    {
      title:"약간더 새롭게",
      url:"https://yandex.com/"
    },

    {
      title:"레야",
      url:"https://www.google.com/"
    },

    {
      title:"야파",
      url:"https://www.google.com/"
    }

  ]

};


let links;

try{

  links=
  JSON.parse(
    localStorage.getItem(KL)
  )
  ||
  JSON.parse(
    JSON.stringify(
      DEFAULT_LINKS
    )
  );

}catch(e){

  links=
  JSON.parse(
    JSON.stringify(
      DEFAULT_LINKS
    )
  );

}


/* =====================================================
   기본 상태
===================================================== */

let page="root";

let ctx={};


let data1;

try{

  data1=
  JSON.parse(
    localStorage.getItem(K1)
  )
  ||
  [
    "abcdefg",
    "hijklm",
    "123456"
  ];

}catch(e){

  data1=[
    "abcdefg",
    "hijklm",
    "123456"
  ];

}


let planner;

try{

  planner=
  JSON.parse(
    localStorage.getItem(KC)
  )
  ||
  {
    "월요일":[],
    "화요일":[],
    "수요일":[],
    "목요일":[],
    "금요일":[],
    "토요일":[],
    "일요일":[]
  };

}catch(e){

  planner={
    "월요일":[],
    "화요일":[],
    "수요일":[],
    "목요일":[],
    "금요일":[],
    "토요일":[],
    "일요일":[]
  };

}


let data2;

try{

  data2=
  JSON.parse(
    localStorage.getItem(K2)
  )
  ||
  {
    groups:[
      {
        name:"국어",
        choices:[]
      },
      {
        name:"영어",
        choices:[]
      },
      {
        name:"수학",
        choices:[]
      },
      {
        name:"역사",
        choices:[]
      },
      {
        name:"과학",
        choices:[]
      },
      {
        name:"도덕",
        choices:[]
      },
      {
        name:"기가",
        choices:[]
      },
      {
        name:"정보",
        choices:[]
      }
    ],
    info:{}
  };

}catch(e){

  data2={
    groups:[
      {
        name:"국어",
        choices:[]
      },
      {
        name:"영어",
        choices:[]
      },
      {
        name:"수학",
        choices:[]
      },
      {
        name:"역사",
        choices:[]
      },
      {
        name:"과학",
        choices:[]
      },
      {
        name:"도덕",
        choices:[]
      },
      {
        name:"기가",
        choices:[]
      },
      {
        name:"정보",
        choices:[]
      }
    ],
    info:{}
  };

}


const screen=
document.getElementById(
  "screen"
);


/* =====================================================
   공용 UI
===================================================== */

function save2(){

  localStorage.setItem(
    K2,
    JSON.stringify(data2)
  );

}


function shell(
  k,
  t,
  d
){

  screen.innerHTML=`

    <div class="kicker">
      ${escapeBasic(k)}
    </div>

    <h1>
      ${escapeBasic(t)}
    </h1>

    <p class="desc">
      ${escapeBasic(d)}
    </p>

  `;

}


function escapeBasic(x){

  return String(
    x ?? ""
  ).replace(

    /[&<>"']/g,

    m=>({

      "&":"&amp;",

      "<":"&lt;",

      ">":"&gt;",

      '"':"&quot;",

      "'":"&#39;"

    }[m])

  );

}


function choice(
  t,
  s,
  fn
){

  const b=
  document.createElement(
    "button"
  );

  b.className=
  "choice";


  const a=
  document.createElement(
    "strong"
  );

  a.textContent=t;


  const c=
  document.createElement(
    "small"
  );

  c.textContent=
  s || "";


  b.append(
    a,
    c
  );

  b.onclick=fn;

  return b;

}


function grid(...els){

  const g=
  document.createElement(
    "div"
  );

  g.className=
  "grid";

  g.append(
    ...els
  );

  screen.appendChild(
    g
  );

}


function back(target){

  const b=
  document.createElement(
    "button"
  );

  b.className=
  "back";

  b.textContent=
  "← 이전으로";

  b.onclick=()=>{

    page=target;

    render();

    window.scrollTo(
      0,
      0
    );

  };

  screen.appendChild(
    b
  );

}


function key(
  g,
  c
){

  return `${g}::${c}`;

}


/* =====================================================
   페이지
===================================================== */

function render(){

  if(page==="root"){

    shell(
      txt.rootKicker,
      txt.rootTitle,
      txt.rootDesc
    );

    grid(

      choice(
        txt.root1,
        txt.root1Sub,
        ()=>{
          page="one";
          render();
        }
      ),

      choice(
        txt.root2,
        txt.root2Sub,
        ()=>{
          page="two";
          render();
        }
      ),

      choice(
        txt.root3,
        txt.root3Sub,
        ()=>{
          page="c";
          render();
        }
      ),

      choice(
        txt.root4,
        txt.root4Sub,
        ()=>{
          page="d";
          render();
        }
      )

    );

    return;

  }


  /* ===================================================
     A
  =================================================== */

  if(page==="one"){

    shell(
      txt.root1,
      txt.oneTitle,
      txt.oneDesc
    );

    grid(

      choice(
        txt.oneA,
        txt.oneASub,
        ()=>{
          page="oneA";
          render();
        }
      ),

      choice(
        txt.oneB,
        txt.oneBSub,
        ()=>{
          page="oneB";
          render();
        }
      )

    );

    back(
      "root"
    );

    return;

  }


  if(page==="oneA"){

    shell(
      txt.oneA,
      txt.oneATitle,
      txt.oneADesc
    );

    grid(

      choice(
        txt.dataView,
        txt.dataViewSub,
        ()=>{
          page="oneA_list";
          render();
        }
      ),

      choice(
        txt.dataEdit,
        txt.dataEditSub,
        ()=>{
          page="oneA_edit";
          render();
        }
      )

    );

    back(
      "one"
    );

    return;

  }


  if(page==="oneA_list"){

    shell(

function exportSettings(){

  const payload={

    version:2,

    exportedAt:
    new Date()
    .toISOString(),

    text:txt,

    links:links,

    option1Data:
    data1,

    option2Data:
    data2,

    planner:
    planner

  };


  const blob=
  new Blob(

    [
      JSON.stringify(
        payload,
        null,
        2
      )
    ],

    {
      type:
      "application/json"
    }

  );


  const url=
  URL.createObjectURL(
    blob
  );


  const a=
  document.createElement(
    "a"
  );


  a.href=
  url;


  a.download=
  "path-settings-윤강닷컴.json";


  document.body.appendChild(
    a
  );


  a.click();


  a.remove();


  setTimeout(

    ()=>URL.revokeObjectURL(
      url
    ),

    1000

  );

}


async function importSettings(
  file
){

  if(!file){
    return;
  }


  try{

    const obj=
    JSON.parse(
      await file.text()
    );


    if(obj.text){

      txt=
      obj.text;

      localStorage.setItem(
        KT,
        JSON.stringify(txt)
      );

    }


    if(obj.links){

      links=
      obj.links;

      localStorage.setItem(
        KL,
        JSON.stringify(links)
      );

    }


    if(
      Array.isArray(
        obj.option1Data
      )
    ){

      data1=
      obj.option1Data;

      localStorage.setItem(
        K1,
        JSON.stringify(data1)
      );

    }


    if(
      obj.option2Data
    ){

      data2=
      obj.option2Data;

      localStorage.setItem(
        K2,
        JSON.stringify(data2)
      );

    }


    if(
      obj.planner
    ){

      planner=
      obj.planner;

      localStorage.setItem(
        KC,
        JSON.stringify(planner)
      );

    }


    document.getElementById(
      "brandText"
    ).textContent=
    txt.brand
    ||
    "윤강닷컴";


    render();


    openEditorHome();


    alert(
      "설정을 가져왔습니다."
    );

  }

  catch(e){

    alert(
      "설정 파일을 읽지 못했습니다."
    );

  }

}

/* =====================================================
   CLOUDFLARE KBO API

   ★ 중요 ★
   Netlify 주소가 아니다.

   Cloudflare Worker의 /api/kbo 사용.
===================================================== */

const KBO_API=
"/api/kbo";


function esc(x){

  return String(
    x ?? ""
  ).replace(

    /[&<>"']/g,

    m=>({

      "&":"&amp;",

      "<":"&lt;",

      ">":"&gt;",

      '"':"&quot;",

      "'":"&#39;"

    }[m])

  );

}


async function kboGet(
  type,
  params={}
){

  const q=
  new URLSearchParams({

    type,

    ...params

  });


  const url=
  KBO_API+
  "?"+
  q.toString();


  const r=
  await fetch(

    url,

    {
      cache:
      "no-store",

      headers:{
        "accept":
        "application/json"
      }

    }

  );


  let j={};


  try{

    j=
    await r.json();

  }

  catch(e){

    throw new Error(
      "KBO API가 JSON을 반환하지 않았습니다."
    );

  }


  if(!r.ok){

    throw new Error(

      j.error
      ||
      (
        "KBO 데이터 오류 "
        +
        r.status
      )

    );

  }


  return j;

}


/* =====================================================
   KBO 표
===================================================== */

function kboTable(
  headers,
  rows
){

  if(
    !rows
    ||
    !rows.length
  ){

    return `

      <div class="kboMuted">

        표시할 데이터가 없습니다.

      </div>

    `;

  }


  const hs=
  headers
  ||
  [];


  return `

    <div class="kboTableWrap">

      <table class="kboTable">

        ${
          hs.length

          ?

          `

            <thead>

              <tr>

                ${
                  hs
                  .map(
                    h=>
                    `<th>${esc(h)}</th>`
                  )
                  .join("")
                }

              </tr>

            </thead>

          `

          :

          ""
        }


        <tbody>

          ${
            rows.map(

              r=>`

                <tr>

                  ${
                    r.map(
                      c=>
                      `<td>${esc(c)}</td>`
                    )
                    .join("")
                  }

                </tr>

              `

            )
            .join("")
          }

        </tbody>

      </table>

    </div>

  `;

}

                  )

/* =====================================================
   선수 시즌기록 추출

   KBO의 첫 시즌 기록표들을 사용한다.
   최근 경기 표가 시즌 기록을 덮어쓰지 않도록
   앞쪽 통계표를 우선한다.
===================================================== */

function tableToStats(
  table
){

  const result={};


  if(
    !table
  ){
    return result;
  }


  const headers=
  table.headers
  ||
  [];


  const rows=
  table.rows
  ||
  [];


  if(
    !headers.length
    ||
    !rows.length
  ){
    return result;
  }


  let row=
  rows.find(

    r=>
      String(
        r.join(" ")
      )
      .includes("롯데")

  );


  if(!row){

    row=
    rows.find(

      r=>
      String(
        r[0]
        ||
        ""
      )
      .trim()
      ===
      "2026"

    );

  }


  if(!row){

    row=
    rows[0];

  }


  headers.forEach(

    (h,i)=>{

      if(
        h!==undefined
        &&
        row[i]!==undefined
      ){

        const k=
        String(h)
        .trim();


        if(k){

          result[k]=
          row[i];

        }

      }

    }

  );


  return result;

}


function collectSeasonStats(
  tables
){

  const stats={};


  /*
    첫 두 개 기록표 중심.

    투수의 경우
    첫 번째 표:
    ERA, G, W, L, IP 등

    다음 표:
    SO, WHIP 등

    타자도 기본 기록표가
    앞부분에 배치되는 형태를 이용.
  */

  (
    tables
    ||
    []
  )
  .slice(
    0,
    2
  )
  .forEach(

    t=>{

      Object.assign(
        stats,
        tableToStats(t)
      );

    }

  );


  return stats;

}


function statValue(
  stats,
  names
){

  for(
    const n
    of
    names
  ){

    if(
      stats[n]!==undefined
      &&
      stats[n]!==null
      &&
      String(
        stats[n]
      )
      .trim()
      !==
      ""
    ){

      return stats[n];

    }

  }


  return "-";

}


function statCard(
  label,
  value
){

  return `

    <div class="statCard">

      <div class="statLabel">

        ${esc(label)}

      </div>


      <div class="statValue">

        ${esc(value)}

      </div>

    </div>

  `;

}

function showLottePlayer(
  name,
  pos,
  no
){

  shell(

    "D-2 · PLAYER",

    name,

    `롯데 자이언츠 · ${pos} · #${no||"-"}`

  );


  const b=
  document.createElement(
    "div"
  );


  b.innerHTML=`

    <div class="kboBox">

      <div class="kboLoading">

        ${esc(name)}
        선수 기록 불러오는 중...

      </div>

    </div>

  `;


  screen.appendChild(
    b
  );


  back(
    "d_roster"
  );


  window.scrollTo(
    0,
    0
  );


  kboGet(

    "player",

    {

      name:name,

      number:no,

      position:pos

    }

  )

  .then(j=>{

    const player=
    j.player
    ||
    {};


    const profile=
    j.profile
    ||
    {};


    const tables=
    (
      j.tables
      ||
      []
    )
    .filter(
      t=>
      (
        t.rows
        ||
        []
      )
      .length
    );

    collectSeasonStats(
      tables
    );

      pos==="투수"

      String(
        profile.position

        ""
      )
      .includes(
        "투수"
      );

        [

          statValue(
            stats,
            [

              "평균자책점"
            ]
          )
        ],

        [
          "경기",
          statValue(
            stats,
            [
              "G",
              "경기"
            ]
          )
        ],

        [
          "승",
          statValue(
            stats,
            [
              "W",
              "승"
            ]
          )
        ],

        [
          "패",
          statValue(
            stats,
            [
              "L",
              "패"
            ]
          )
        ],

        [
          "세이브",
          statValue(
            stats,
            [
              "SV",
              "세이브"
            ]
          )
        ],

        [
          "홀드",
          statValue(
            stats,
            [
              "HLD",
              "홀드"
            ]
          )
        ],

        [
          "이닝",
          statValue(
            stats,
            [
              "IP",
              "이닝"
            ]
          )
        ],

        [
          "탈삼진",
          statValue(
            stats,
            [
              "SO",
              "K",
              "탈삼진"
            ]
          )
        ]

      ];

    }

    else{

      items=[

        [
          "타율",
          statValue(
            stats,
            [
              "AVG",
              "타율"
            ]
          )
        ],

        [
          "경기",
          statValue(
            stats,
            [
              "G",
              "경기"
            ]
          )
        ],

        [
          "타수",
          statValue(
            stats,
            [
              "AB",
              "타수"
            ]
          )
        ],

        [
          "안타",
          statValue(
            stats,
            [
              "H",
              "안타"
            ]
          )
        ],

        [
          "홈런",
          statValue(
            stats,
            [
              "HR",
              "홈런"
            ]
          )
        ],

        [
          "타점",
          statValue(
            stats,
            [
              "RBI",
              "타점"
            ]
          )
        ],

        [
          "득점",
          statValue(
            stats,
            [
              "R",
              "득점"
            ]
          )
        ],

        [

          statValue(
            stats,
            [

      ];

    const displayName=
    profile.name
    ||
    player.name

    name;


    const displayNumber=
    profile.number

    ||

    ||
    "-";


    const displayPosition=
    profile.position
    ||
    player.position
    ||
    pos
    ||
    "-";


    b.innerHTML=`

      <div class="kboBox playerHero">

        <div class="kicker">

        </div>


        <div class="playerSub">

          ${esc(displayPosition)}

      </div>

        <div class="kboTitle">

          2026 시즌 기록

        </div>


        <div class="playerStats">

          ${
            items
            .map(

              x=>

              statCard(
                x[0],
                x[1]
              )

            )
            .join("")
          }

        </div>

      </div>


      <div class="kboBox">

        <div class="kboTitle">

          선수 정보

        </div>


        <div class="playerInfoRow">

          <div class="playerInfoLabel">

      </div>


      ${
        tables.length

        ?

        `

          <details
            class="kboBox"
          >

            <summary style="
              cursor:pointer;
              font-weight:850;
              padding:4px 0
            ">

              전체 기록표 보기

            </summary>


            <div
              style="
                margin-top:15px
              "
            >

              ${
                tables
                .slice(
                  0,
                  6
                )
                .map(

                  t=>

                  kboTable(
                    t.headers,
                    t.rows
                  )

                )
                .join(

                  '<div class="kboSection"></div>'

                )
              }

            </div>

          </details>

        `

        :

        ""
      }

    `;

  })

  .catch(e=>{

    b.innerHTML=`

      <div class="kboBox">

        <div class="kboError">

          선수 기록을 불러오지 못했습니다.

          <br><br>

          ${esc(e.message)}

        </div>

      </div>

    `;

  });

}


/* =====================================================
   D-3 일정 + 순위
===================================================== */

function loadScheduleRank(
  box
){

  box.innerHTML=`

    <div class="kboLoading">

      일정과 순위 불러오는 중...

    </div>

  `;


  Promise.all([

    kboGet(
      "schedule"
    ),

    kboGet(
      "standings"
    )

  ])

  .then(
    ([a,b])=>{

      const sched=
      a.rows
      ||
      [];


      const rank=
      b.table;


      box.innerHTML=`

        <div class="kboTitle">

          롯데 경기일정

        </div>


        ${
          kboTable(
            a.headers
            ||
            [],
            sched
          )
        }


        <div class="kboSection">

          <div class="kboTitle">

            KBO 리그 순위

          </div>


          ${
            rank

            ?

            kboTable(
              rank.headers
              ||
              [],
              rank.rows
              ||
              []
            )

            :

            `

              <div class="kboMuted">

                순위를 찾지 못했습니다.

              </div>

            `
          }

        </div>

      `;

    }

  )

  .catch(e=>{

    box.innerHTML=`

      <div class="kboError">

        경기일정 또는 순위를 불러오지 못했습니다.

        <br><br>

        ${esc(e.message)}

      </div>

    `;

  });

}
