<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>윤강닷컴 · LOTTE LIVE V4</title>
<style>
:root{--bg:#0b0d11;--card:#151922;--card2:#1b202a;--line:#2a313d;--text:#f4f7fb;--muted:#929baa;--accent:#d9ff5a;--green:#4dd17a;--orange:#ffb24a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif}
button,input,textarea,select{font:inherit}
.app{max-width:520px;margin:auto;min-height:100svh;padding:22px 18px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.brand{font-weight:900;letter-spacing:.18em;font-size:13px}
.home{border:0;border-radius:14px;padding:11px 14px;background:var(--card2);color:var(--text);font-weight:800}
.kicker{font-size:12px;color:var(--accent);font-weight:900;letter-spacing:.1em;margin-bottom:10px}
h1{font-size:32px;line-height:1.18;margin:0 0 10px;letter-spacing:-.04em}
.desc{color:var(--muted);line-height:1.7;margin:0 0 24px}
.grid{display:grid;gap:11px}
.choice{width:100%;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--text);padding:18px;text-align:left}
.choice strong{display:block;font-size:17px}
.choice small{display:block;margin-top:5px;color:var(--muted)}
.back{width:100%;margin-top:18px;padding:14px;border:0;background:transparent;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.row .code{flex:1;word-break:break-all}
.action{border:0;border-radius:12px;padding:10px 12px;background:var(--accent);color:#111;font-weight:900}
.editor{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
textarea,input,select{width:100%;background:#0e1117;color:var(--text);border:1px solid var(--line);border-radius:14px;padding:13px;font-size:16px}
textarea{min-height:160px;resize:vertical}
.save{width:100%;margin-top:12px;border:0;border-radius:15px;padding:14px;background:var(--accent);color:#111;font-weight:900}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:12px}
.placeholder{background:var(--card);border:1px dashed var(--line);border-radius:20px;padding:22px;color:var(--muted);line-height:1.7}
.label{font-size:12px;color:var(--muted);font-weight:800;margin:12px 0 7px}
.manageItem{display:flex;gap:8px;align-items:center;margin-top:9px}
.manageItem input{flex:1}
.del{border:0;border-radius:12px;background:#2a1a1d;color:#ff8b8b;padding:11px}
.infoCard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px}
.infoCard h2{margin:0 0 10px;font-size:25px}
.infoCard p{white-space:pre-wrap;color:var(--muted);line-height:1.75;margin:0}

.textEditBtn{border:0;border-radius:14px;padding:11px 14px;background:var(--accent);color:#111;font-weight:900}
.editOverlay{display:none;position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto}
.editOverlay.open{display:block}
.editWrap{max-width:520px;margin:auto;padding:22px 18px 44px}
.editHead{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;background:rgba(11,13,17,.96);backdrop-filter:blur(12px);padding:10px 0 14px;z-index:3}
.editHead h2{margin:0;font-size:21px}
.editSection{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
.editSection h3{margin:0 0 13px;font-size:14px}
.editLabel{display:block;color:var(--muted);font-size:11px;font-weight:800;margin:11px 0 6px}
.editInput{width:100%;background:#0e1117;color:var(--text);border:1px solid var(--line);border-radius:13px;padding:12px;font-size:16px}
.editActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
.editMenu{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.editMenuBtn{min-height:92px;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--text);font-size:24px;font-weight:900;text-align:left;padding:18px}
.editMenuBtn small{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-top:6px}
.editBack{border:0;background:transparent;color:var(--muted);font-weight:800;padding:10px 2px}
.urlHint{font-size:11px;color:var(--muted);line-height:1.5;margin-top:5px}
.backupBox{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.backupBox h3{margin:0 0 8px;font-size:14px}
.backupActions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fileInput{display:none}

</style>

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="윤강닷컴">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">


<style>
.kboBox{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.kboTitle{font-weight:800;margin-bottom:10px}.kboMuted{color:var(--muted);font-size:12px;line-height:1.55}
.kboGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.kboPlayer{padding:11px;border:1px solid var(--line);border-radius:13px;background:transparent;color:var(--text);text-align:left}
.kboPlayer small{display:block;color:var(--muted);margin-top:3px}
.kboTable{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}.kboTable td,.kboTable th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:center}
.kboTable th{color:var(--muted)}.kboLink{color:var(--accent);font-weight:700}
</style>

<style>
.kboLiveHead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.kboRefresh{border:1px solid var(--line);border-radius:11px;background:transparent;color:var(--text);padding:8px 10px;font-weight:700}
.kboScore{font-size:30px;font-weight:900;margin:10px 0}
.kboGame{padding:13px;border:1px solid var(--line);border-radius:14px;margin-top:10px}
.kboTableWrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.kboTable{min-width:520px}
.kboError{padding:12px;border:1px solid var(--line);border-radius:13px;margin-top:10px;color:var(--muted)}
.kboSection{margin-top:16px}
.kboLoading{padding:16px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
<header><div class="brand" id="brandText">PATH</div><div style="display:flex;gap:8px"><button class="home" id="home">처음</button><button class="textEditBtn" id="textEditBtn">텍스트 편집</button></div></header>
<div id="screen"></div>
</div>

<div class="editOverlay" id="textEditor">
 <div class="editWrap">
  <div class="editHead">
   <h2 id="editTitle">텍스트 편집</h2>
   <button class="home" id="closeTextEditor">닫기</button>
  </div>
  <div id="textEditorFields"></div>
 </div>
</div>
<script>
const K1="path-option1-data";
const K2="path-option2-data";
const KC="path-option-c-planner";

const KT="path-site-text-v1";
const KL="path-site-links-v1";
const DEFAULT_TEXT={"brand":"윤강닷컴","rootKicker":"STEP 1","rootTitle":"원하는 항목을 선택하세요","rootDesc":"첫 화면에는 4개의 선택지가 있습니다.","root1":"흐흐흐","root1Sub":"","root2":"시험범위","root2Sub":"","root3":"이번주할일","root3Sub":"","root4":"개발중","root4Sub":".","oneTitle":"뭐할낀데","oneDesc":"","oneA":"만화","oneASub":"","oneB":"영상","oneBSub":"","oneATitle":"히토시마","oneADesc":"","dataView":"보러가기","dataViewSub":"","dataEdit":"품번입력","dataEditSub":"","oneBTitle":"어디서볼래","oneBDesc":"","twoTitle":"이번 시험범위 ","twoDesc":"","twoA":"시험범위 보기","twoASub":"","twoB":"시험범위 입력하기","twoBSub":"","twoC":"필기하기","twoCSub":"","cTitle":"일별 할일 보기","cDesc":"","cView":"이번주 계획","cViewSub":"","cEdit":"계획 작성","cEditSub":"","dTitle":"최지원김은우박서준130","dDesc":"","group-name-0":"국어","group-name-1":"영어","group-name-2":"수학","group-name-3":"역사","group-name-4":"과학","group-name-5":"도덕","group-name-6":"기가","group-name-7":"정보"};
let txt=JSON.parse(localStorage.getItem(KT)||JSON.stringify(DEFAULT_TEXT));
const DEFAULT_LINKS={"oneABase":"https://hitomi.la/reader/","oneB":[{"title":"약간더 새롭게","url":"https://yandex.com/search/touch/?text=%EC%95%BC%EB%8F%99&lr=47156&mda=0&search_source=yacom_touch_common"},{"title":"레야","url":"https://lover938.net/index.php?mid=link1&category=12870&document_srl=34415"},{"title":"야파","url":"https://ydparty06.tv/"}]};
let links=JSON.parse(localStorage.getItem(KL)||JSON.stringify(DEFAULT_LINKS));

let page="root", ctx={};
let data1=JSON.parse(localStorage.getItem(K1)||'["abcdefg","hijklm","123456"]');
let planner=JSON.parse(localStorage.getItem(KC)||JSON.stringify({"월요일": [], "화요일": [], "수요일": [], "목요일": [], "금요일": [], "토요일": [], "일요일": []}));
let data2=JSON.parse(localStorage.getItem(K2)||JSON.stringify({"groups": [{"name": "국어", "choices": []}, {"name": "영어", "choices": []}, {"name": "수학", "choices": []}, {"name": "역사", "choices": []}, {"name": "과학", "choices": []}, {"name": "도덕", "choices": []}, {"name": "기가", "choices": []}, {"name": "정보", "choices": []}], "info": {}}));
const screen=document.getElementById("screen");


function save2(){localStorage.setItem(K2,JSON.stringify(data2))}
function shell(k,t,d){screen.innerHTML=`<div class="kicker">${k}</div><h1>${t}</h1><p class="desc">${d}</p>`}
function choice(t,s,fn){const b=document.createElement("button");b.className="choice";const a=document.createElement("strong");a.textContent=t;const c=document.createElement("small");c.textContent=s||"";b.append(a,c);b.onclick=fn;return b}
function grid(...els){const g=document.createElement("div");g.className="grid";g.append(...els);screen.appendChild(g)}
function back(target){const b=document.createElement("button");b.className="back";b.textContent="← 이전으로";b.onclick=()=>{page=target;render()};screen.appendChild(b)}
function key(g,c){return `${g}::${c}`}

function render(){
 if(page==="root"){
  shell(txt.rootKicker,txt.rootTitle,txt.rootDesc);
  grid(
   choice(txt.root1,txt.root1Sub,()=>{page="one";render()}),
   choice(txt.root2,txt.root2Sub,()=>{page="two";render()}),
   choice(txt.root3,txt.root3Sub,()=>{page="c";render()}),
   choice(txt.root4,txt.root4Sub,()=>{page="d";render()})
  ); return;
 }
 if(page==="one"){
  shell(txt.root1,txt.oneTitle,txt.oneDesc);
  grid(
   choice(txt.oneA,txt.oneASub,()=>{page="oneA";render()}),
   choice(txt.oneB,txt.oneBSub,()=>{page="oneB";render()})
  ); back("root"); return;
 }
 if(page==="oneA"){
  shell(txt.oneA,txt.oneATitle,txt.oneADesc);
  grid(
   choice(txt.dataView,txt.dataViewSub,()=>{page="oneA_list";render()}),
   choice(txt.dataEdit,txt.dataEditSub,()=>{page="oneA_edit";render()})
  ); back("one"); return;
 }
 if(page==="oneA_list"){
  shell("1-A · 데이터 보기","저장된 데이터","각 줄의 [이거다]를 누르면 해당 값이 들어간 주소로 이동합니다.");
  data1.forEach(v=>{const r=document.createElement("div");r.className="row";const c=document.createElement("div");c.className="code";c.textContent=v;const b=document.createElement("button");b.className="action";b.textContent="이거다";b.onclick=()=>window.open((links.oneABase||"")+encodeURIComponent(v)+".html","_blank");r.append(c,b);screen.appendChild(r)});
  back("oneA"); return;
 }
 if(page==="oneA_edit"){
  shell("1-A · 데이터 입력","데이터 편집","한 줄에 하나씩 입력하세요.");
  const e=document.createElement("div");e.className="editor";const ta=document.createElement("textarea");ta.value=data1.join("\n");const s=document.createElement("button");s.className="save";s.textContent="저장";s.onclick=()=>{data1=ta.value.split("\n").map(x=>x.trim()).filter(Boolean);localStorage.setItem(K1,JSON.stringify(data1));alert("저장되었습니다.")};e.append(ta,s);screen.appendChild(e);back("oneA");return;
 }
 if(page==="oneB"){
  shell(txt.oneB,txt.oneBTitle,txt.oneBDesc);
  grid(...links.oneB.map((item,i)=>choice(
    item.title,
    "외부 사이트로 이동",
    ()=>window.open(item.url,"_blank")
  )));
  back("one");return;
 }


 if(page==="c"){
  shell("C · PLANNER",txt.cTitle,txt.cDesc);
  grid(
   choice(txt.cView,txt.cViewSub,()=>{page="c_view_days";render()}),
   choice(txt.cEdit,txt.cEditSub,()=>{page="c_edit_days";render()})
  );
  back("root"); return;
 }
 if(page==="c_view_days"){
  shell("C-1","요일을 선택하세요","선택한 요일의 할 일을 확인합니다.");
  const days=["월요일","화요일","수요일","목요일","금요일","토요일","일요일"];
  grid(...days.map(day=>choice(day,`${(planner[day]||[]).length}개 할 일`,()=>{ctx.day=day;page="c_view_list";render()})));
  back("c"); return;
 }
 if(page==="c_view_list"){
  const day=ctx.day;
  shell("C-1 · 할 일 확인",day,"저장된 할 일입니다.");
  const items=planner[day]||[];
  if(!items.length){
   const p=document.createElement("div");p.className="placeholder";p.textContent="등록된 할 일이 없습니다.";screen.appendChild(p);
  } else {
   items.forEach(item=>{
    const r=document.createElement("div");r.className="row";
    const c=document.createElement("div");c.className="code";c.textContent=item;
    r.appendChild(c);screen.appendChild(r);
   });
  }
  back("c_view_days"); return;
 }
 if(page==="c_edit_days"){
  shell("C-2","요일을 선택하세요","선택한 요일의 할 일을 입력합니다.");
  const days=["월요일","화요일","수요일","목요일","금요일","토요일","일요일"];
  grid(...days.map(day=>choice(day,`${(planner[day]||[]).length}개 저장됨`,()=>{ctx.day=day;page="c_edit";render()})));
  back("c"); return;
 }
 if(page==="c_edit"){
  const day=ctx.day;
  shell("C-2 · 할 일 입력",day,"한 줄에 하나씩 입력하세요. 저장하면 기존 내용이 새 내용으로 바뀝니다.");
  const e=document.createElement("div");e.className="editor";
  const ta=document.createElement("textarea");ta.value=(planner[day]||[]).join("\n");
  const s=document.createElement("button");s.className="save";s.textContent="저장";
  s.onclick=()=>{
   planner[day]=ta.value.split("\n").map(x=>x.trim()).filter(Boolean);
   localStorage.setItem(KC,JSON.stringify(planner));
   alert("저장되었습니다.");
  };
  e.append(ta,s);screen.appendChild(e);back("c_edit_days"); return;
 }
 if(page==="d"){
  shell("D · LOTTE GIANTS","롯데 자이언츠","윤강닷컴 안에서 실시간으로 확인합니다.");
  grid(
   choice("D-1 · 오늘 경기","오늘 경기 · 스코어 · 이닝별 정보",()=>{page="d_today";render()}),
   choice("D-2 · 롯데 선수단","현재 등록 선수 · 선수별 시즌 기록",()=>{page="d_roster";render()}),
   choice("D-3 · 경기일정 / 리그 순위","롯데 일정 · KBO 순위",()=>{page="d_schedule";render()})
  ); back("root"); return;
 }
 if(page==="d_today"){
  shell("D-1 · LIVE","오늘 경기","KBO 공식 데이터");
  const head=document.createElement("div");head.className="kboLiveHead";
  const t=document.createElement("div");t.className="kboMuted";t.textContent="화면 안에서 바로 갱신됩니다.";
  const r=document.createElement("button");r.className="kboRefresh";r.textContent="새로고침";
  head.append(t,r);screen.appendChild(head);
  const b=document.createElement("div");b.className="kboBox";screen.appendChild(b);r.onclick=()=>loadToday(b);loadToday(b);
  back("d");return;
 }
 if(page==="d_roster"){
  shell("D-2 · ROSTER","롯데 선수단","KBO 현재 등록 현황");
  const b=document.createElement("div");screen.appendChild(b);loadRoster(b);
  back("d");return;
 }
 if(page==="d_schedule"){
  shell("D-3 · SCHEDULE","경기일정 / 리그 순위","KBO 공식 데이터");
  const b=document.createElement("div");b.className="kboBox";screen.appendChild(b);loadScheduleRank(b);
  back("d");return;
 }

 if(page==="two"){
  shell(txt.root2,txt.twoTitle,txt.twoDesc);
  grid(
   choice(txt.twoA,txt.twoASub,()=>{page="twoA_groups";render()}),
   choice(txt.twoB,txt.twoBSub,()=>{page="twoB_groups";render()}),
   choice(txt.twoC,txt.twoCSub,()=>{page="twoC_groups";render()})
  ); back("root"); return;
 }

 if(page==="twoA_groups"){
  shell("2-A","8가지 중 하나를 선택하세요","선택한 항목에 등록된 선택지들이 나옵니다.");
  grid(...data2.groups.map((g,i)=>choice(g.name,`${g.choices.length}개 선택지`,()=>{ctx.group=i;page="twoA_choices";render()})));
  back("two");return;
 }
 if(page==="twoA_choices"){
  const g=data2.groups[ctx.group];
  shell("2-A",g.name,"등록된 선택지 중 하나를 고르세요.");
  if(!g.choices.length){const p=document.createElement("div");p.className="placeholder";p.textContent="아직 2-B에서 만든 선택지가 없습니다.";screen.appendChild(p)}
  else grid(...g.choices.map(c=>choice(c,"최종 정보 보기",()=>{ctx.choice=c;page="twoA_info";render()})));
  back("twoA_groups");return;
 }
 if(page==="twoA_info"){
  const g=data2.groups[ctx.group], txt=data2.info[key(ctx.group,ctx.choice)]||"아직 2-C에서 입력한 정보가 없습니다.";
  shell("2-A · 결과",ctx.choice,`${g.name}에서 선택한 최종 정보입니다.`);
  const card=document.createElement("div");card.className="infoCard";const h=document.createElement("h2");h.textContent=ctx.choice;const p=document.createElement("p");p.textContent=txt;card.append(h,p);screen.appendChild(card);back("twoA_choices");return;
 }

 if(page==="twoB_groups"){
  shell("2-B","중간 선택지 관리","8가지 중 하나를 골라 그 안의 선택지를 관리합니다.");
  grid(...data2.groups.map((g,i)=>choice(g.name,`${g.choices.length}개 등록됨`,()=>{ctx.group=i;page="twoB_manage";render()})));
  back("two");return;
 }
 if(page==="twoB_manage"){
  const g=data2.groups[ctx.group];
  shell("2-B",`${g.name} 선택지 관리`,"새 선택지를 추가하거나 기존 선택지를 삭제할 수 있습니다.");
  const e=document.createElement("div");e.className="editor";
  const lab=document.createElement("div");lab.className="label";lab.textContent="새 선택지";
  const inp=document.createElement("input");inp.placeholder="예: 선택지 A";
  const add=document.createElement("button");add.className="save";add.textContent="+ 추가";add.onclick=()=>{const v=inp.value.trim();if(!v)return;if(!g.choices.includes(v))g.choices.push(v);save2();render()};
  e.append(lab,inp,add);
  g.choices.forEach((c,idx)=>{const r=document.createElement("div");r.className="manageItem";const i=document.createElement("input");i.value=c;i.onchange=()=>{const old=c,newv=i.value.trim();g.choices[idx]=newv;const oldKey=key(ctx.group,old),newKey=key(ctx.group,newv);if(data2.info[oldKey]!==undefined){data2.info[newKey]=data2.info[oldKey];delete data2.info[oldKey]}save2()};const d=document.createElement("button");d.className="del";d.textContent="삭제";d.onclick=()=>{delete data2.info[key(ctx.group,c)];g.choices.splice(idx,1);save2();render()};r.append(i,d);e.appendChild(r)});
  screen.appendChild(e);back("twoB_groups");return;
 }

 if(page==="twoC_groups"){
  shell("2-C","최종 정보 관리","8가지 중 하나를 선택하세요.");
  grid(...data2.groups.map((g,i)=>choice(g.name,`${g.choices.length}개 선택지`,()=>{ctx.group=i;page="twoC_choices";render()})));
  back("two");return;
 }
 if(page==="twoC_choices"){
  const g=data2.groups[ctx.group];
  shell("2-C",g.name,"2-B에서 만든 선택지 중 하나를 고르세요.");
  if(!g.choices.length){const p=document.createElement("div");p.className="placeholder";p.textContent="먼저 2-B에서 선택지를 만들어주세요.";screen.appendChild(p)}
  else grid(...g.choices.map(c=>choice(c,"최종 정보 입력/수정",()=>{ctx.choice=c;page="twoC_edit";render()})));
  back("twoC_groups");return;
 }
 if(page==="twoC_edit"){
  const g=data2.groups[ctx.group], k=key(ctx.group,ctx.choice);
  shell("2-C",`${ctx.choice} 정보 관리`,`${g.name} > ${ctx.choice}의 최종 정보를 입력하세요.`);
  const e=document.createElement("div");e.className="editor";const ta=document.createElement("textarea");ta.value=data2.info[k]||"";ta.placeholder="최종 정보를 입력하세요.";const s=document.createElement("button");s.className="save";s.textContent="저장";s.onclick=()=>{data2.info[k]=ta.value;save2();alert("저장되었습니다.")};e.append(ta,s);screen.appendChild(e);back("twoC_choices");return;
 }
}

function field(label,value,key,type="text"){

 editTitle.textContent="텍스트 편집";

 brandSave.onclick=()=>{
   const el=brandSec.querySelector('[data-key="brand-home"]');

 };
 brandSec.appendChild(brandSave);
 textEditorFields.appendChild(brandSec);
 const menu=document.createElement("div");menu.className="editMenu";
 [["A","선택지 1 · 1-A · 1-B"],["B","선택지 2 · 2-A/B/C"],["C","플래너"],["D","추후 설정"]].forEach(([k,s])=>{

 const bp=document.createElement("div");bp.className="urlHint";
 bp.textContent="텍스트, 링크, B의 8개 항목 이름, 저장된 데이터와 플래너를 파일로 내보내거나 다시 가져올 수 있습니다.";
 backup.appendChild(bp);

 acts.append(ex,im);backup.appendChild(acts,fi);

}
function openEditorGroup(group){
 const cfg=EDIT_GROUPS[group];
 editTitle.textContent=cfg.title;
 textEditorFields.innerHTML="";
 const backBtn=document.createElement("button");backBtn.className="editBack";backBtn.textContent="← A / B / C / D";
 backBtn.onclick=openEditorHome;textEditorFields.appendChild(backBtn);

 const sec=document.createElement("div");sec.className="editSection";
 cfg.fields.forEach(([key,label])=>sec.appendChild(field(label,txt[key],key)));
 textEditorFields.appendChild(sec);

 if(group==="B"){
  const groupSec=document.createElement("div");groupSec.className="editSection";

function saveGroup(group){
 textEditorFields.querySelectorAll("[data-key]").forEach(i=>{
  const k=i.dataset.key;
  if(k.startsWith("link-")) return;
  txt[k]=i.value;
 });
 if(group==="B"){
  for(let i=0;i<data2.groups.length;i++){
   const el=textEditorFields.querySelector(`[data-key="group-name-${i}"]`);
   if(el) data2.groups[i].name=el.value.trim()||`항목 ${i+1}`;
  }
  localStorage.setItem(K2,JSON.stringify(data2));
 }
 if(group==="A"){
  const base=textEditorFields.querySelector('[data-key="link-oneABase"]');

   const t=textEditorFields.querySelector(`[data-key="link-oneB-title-${i}"]`);
   const u=textEditorFields.querySelector(`[data-key="link-oneB-url-${i}"]`);
   if(t) links.oneB[i].title=t.value;
   if(u) links.oneB[i].url=u.value.trim();
  }
  localStorage.setItem(KL,JSON.stringify(links));
 }
 localStorage.setItem(KT,JSON.stringify(txt));
 document.getElementById("brandText").textContent=txt.brand||"PATH";
 render();
 alert(group+" 항목을 저장했습니다.");
}
function resetGroup(group){
 if(!confirm(group+" 항목의 텍스트를 기본값으로 되돌릴까요?")) return;
 EDIT_GROUPS[group].fields.forEach(([key])=>txt[key]=DEFAULT_TEXT[key]);
 if(group==="A") links=JSON.parse(JSON.stringify(DEFAULT_LINKS));
 if(group==="B"){
  data2.groups.forEach((g,i)=>g.name=`항목 ${i+1}`);
  localStorage.setItem(K2,JSON.stringify(data2));
 }
 localStorage.setItem(KT,JSON.stringify(txt));
 localStorage.setItem(KL,JSON.stringify(links));
 openEditorGroup(group);render();
}

function exportSettings(){
 const payload={
  version:1,
  exportedAt:new Date().toISOString(),
  text:txt,
  links:links,
  option1Data:data1,
  option2Data:data2,
  planner:planner
 };
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;a.download="path-settings.json";
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function importSettings(file){
 if(!file) return;
 try{
  const obj=JSON.parse(await file.text());
  if(obj.text){txt=obj.text;localStorage.setItem(KT,JSON.stringify(txt));}
  if(obj.links){links=obj.links;localStorage.setItem(KL,JSON.stringify(links));}
  if(Array.isArray(obj.option1Data)){data1=obj.option1Data;localStorage.setItem(K1,JSON.stringify(data1));}
  if(obj.option2Data){data2=obj.option2Data;localStorage.setItem(K2,JSON.stringify(data2));}
  if(obj.planner){planner=obj.planner;localStorage.setItem(KC,JSON.stringify(planner));}
  document.getElementById("brandText").textContent=txt.brand||"PATH";
  render();openEditorHome();
  alert("설정을 가져왔습니다.");
 }catch(e){
  alert("설정 파일을 읽지 못했습니다.");
 }
}

document.getElementById("home").onclick=()=>{page="root";ctx={};render()};
render();
</script>

<script>
const KBO_API="/.netlify/functions/kbo";
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
async function kboGet(type,params={}){
 const q=new URLSearchParams({type,...params});
 const r=await fetch(KBO_API+"?"+q.toString(),{cache:"no-store"});
 const j=await r.json().catch(()=>({}));
 if(!r.ok) throw new Error(j.error||("KBO 데이터 오류 "+r.status));
 return j;
}
function kboTable(headers,rows){
 if(!rows||!rows.length)return '<div class="kboMuted">표시할 데이터가 없습니다.</div>';
 return `<div class="kboTableWrap"><table class="kboTable"><thead><tr>${(headers||[]).map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function loadToday(box){
 box.innerHTML='<div class="kboLoading">오늘 경기 불러오는 중...</div>';
 kboGet("score").then(j=>{
   const g=j.games||[];
   if(!g.length){box.innerHTML='<div class="kboMuted">오늘 롯데 경기가 없거나 아직 경기 정보가 공개되지 않았습니다.</div>';return;}
   box.innerHTML=g.map(x=>`<div class="kboGame"><div class="kboLiveHead"><b>${esc(x.away)} vs ${esc(x.home)}</b><span class="kboMuted">${esc(x.status||x.time||"")}</span></div><div class="kboScore">${esc(x.awayScore)} : ${esc(x.homeScore)}</div>${x.table?kboTable(x.table.headers,x.table.rows):""}</div>`).join("");
 }).catch(e=>box.innerHTML='<div class="kboError">'+esc(e.message)+'</div>');
}
function loadRoster(box){
 box.innerHTML='<div class="kboLoading">등록 선수 불러오는 중...</div>';
 kboGet("roster").then(j=>{
   const groups=j.groups||{};
   box.innerHTML=Object.entries(groups).map(([pos,arr])=>`<div class="kboBox"><div class="kboTitle">${esc(pos)} · ${arr.length}명</div><div class="kboGrid">${arr.map(p=>`<button class="kboPlayer" data-player-path="${esc(p.path||"")}" data-player-name="${esc(p.name)}" data-player-pos="${esc(pos)}" data-player-no="${esc(p.number||"")}"><b>${esc(p.name)}</b><small>#${esc(p.number||"")}</small></button>`).join("")}</div></div>`).join("")||'<div class="kboMuted">선수 명단을 찾지 못했습니다.</div>';
   box.querySelectorAll("[data-player-path]").forEach(btn=>btn.addEventListener("click",()=>showLottePlayer(btn.dataset.playerName,btn.dataset.playerPos,btn.dataset.playerNo,btn.dataset.playerPath)));
 }).catch(e=>box.innerHTML='<div class="kboError">'+esc(e.message)+'</div>');
}
function showLottePlayer(name,pos,no,path){
 shell("D-2 · PLAYER",name,`${pos} · 등번호 ${no||"-"}`);
 const b=document.createElement("div");b.className="kboBox";b.innerHTML='<div class="kboLoading">시즌 기록 불러오는 중...</div>';screen.appendChild(b);back("d_roster");
 if(!path){b.innerHTML='<div class="kboMuted">선수 상세 주소를 찾지 못했습니다.</div>';return;}
 kboGet("player",{path}).then(j=>{
   const tables=(j.tables||[]).filter(t=>(t.rows||[]).length);
   b.innerHTML=`<div class="kboTitle">${esc(name)} 시즌 기록</div>`+(tables.length?tables.slice(0,4).map(t=>kboTable(t.headers,t.rows)).join('<div class="kboSection"></div>'):'<div class="kboMuted">표시 가능한 시즌 기록을 찾지 못했습니다.</div>');
 }).catch(e=>b.innerHTML='<div class="kboError">'+esc(e.message)+'</div>');
}
function loadScheduleRank(box){
 box.innerHTML='<div class="kboLoading">일정과 순위 불러오는 중...</div>';
 Promise.all([kboGet("schedule"),kboGet("standings")]).then(([a,b])=>{
  const sched=a.rows||[];
  const rank=b.table;
  box.innerHTML=`<div class="kboTitle">롯데 경기일정</div>${kboTable(a.headers||[],sched)}
  <div class="kboSection"><div class="kboTitle">KBO 리그 순위</div>${rank?kboTable(rank.headers,rank.rows):'<div class="kboMuted">순위를 찾지 못했습니다.</div>'}</div>`;
 }).catch(e=>box.innerHTML='<div class="kboError">'+esc(e.message)+'</div>');
}
</script>
</body>
